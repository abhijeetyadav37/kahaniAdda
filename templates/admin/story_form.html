{% extends 'base.html' %}{% block title %}{{ heading }} — Admin{% endblock %}{% block content %}<section class="form-section"><form method="post" class="form-card"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="eyebrow">EDITOR'S DESK</div><h1>{{ heading }}</h1><div class="field-grid"><label>Title *<input name="title" maxlength="180" required value="{{ data.title }}"></label><label>URL slug<input name="slug" maxlength="190" value="{{ data.slug }}"></label><label>Author *<input name="author" maxlength="100" required value="{{ data.author }}"></label><label>Genre<select name="genre">{% for g in genres %}<option {% if data.genre==g %}selected{% endif %}>{{ g }}</option>{% endfor %}</select></label><label>Language<select name="language">{% for l in languages %}<option {% if data.language==l %}selected{% endif %}>{{ l }}</option>{% endfor %}</select></label><label>Status<select name="status"><option value="draft" {% if data.status=='draft' %}selected{% endif %}>Draft</option><option value="published" {% if data.status=='published' %}selected{% endif %}>Published</option></select></label></div><label>Tags, comma-separated<input name="tags" maxlength="300" value="{{ data.tags }}"></label><label>Story content *<textarea name="content" rows="16" maxlength="50000" required>{{ data.content }}</textarea></label><label class="check-label"><input type="checkbox" name="featured" value="yes" {% if data.featured %}checked{% endif %}> Feature this story</label><button class="btn primary full">Save story →</button><a class="text-link" href="{{ url_for('admin_dashboard') }}">Cancel</a></form></section>{% endblock %}
