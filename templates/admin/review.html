{% extends 'base.html' %}{% block title %}Review Submission — Admin{% endblock %}{% block content %}<section class="form-section"><form method="post" class="form-card"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="eyebrow">SUBMISSION REVIEW · {{ sub.status|upper }}</div><h1>{{ sub.title }}</h1><p>Submitted by {{ sub.pen_name }}{% if sub.email %} · {{ sub.email }}{% endif %}</p><div class="field-grid"><label>Title<input name="title" maxlength="180" required value="{{ sub.title }}"></label><label>Author credit<input name="author" maxlength="100" required value="{{ sub.pen_name }}"></label><label>Genre<select name="genre">{% for g in genres %}<option {% if sub.genre==g %}selected{% endif %}>{{ g }}</option>{% endfor %}</select></label><label>Language<select name="language">{% for l in languages %}<option {% if sub.language==l %}selected{% endif %}>{{ l }}</option>{% endfor %}</select></label></div><label>Content — edit before publishing<textarea name="content" rows="16" maxlength="50000" required>{{ sub.content }}</textarea></label><div class="admin-actions"><button class="btn primary" name="action" value="publish">Approve & publish</button><button class="btn outline" name="action" value="changes">Request changes</button><button class="btn outline danger" name="action" value="reject">Reject</button></div></form></section>{% endblock %}
