{% extends 'base.html' %}{% block title %}Site Settings — Admin{% endblock %}{% block content %}<section class="form-section"><form method="post" class="form-card"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="eyebrow">SITE CONFIGURATION</div><h1>Small details, <em>big difference.</em></h1><label>Owner / editor name<input name="owner_name" maxlength="200" value="{{ settings.get('owner_name','') }}"></label><label>Public contact email<input type="email" name="contact_email" maxlength="254" value="{{ settings.get('contact_email','') }}"></label><label class="check-label"><input type="checkbox" name="ads_enabled" value="1" {% if settings.get('ads_enabled')=='1' %}checked{% endif %}> Show clearly labeled ad placeholders</label><p class="notice">This does not activate AdSense or inject ad scripts. Live advertising requires approved account details and a code integration.</p><button class="btn primary full">Save settings</button></form></section>{% endblock %}
